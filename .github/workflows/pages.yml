name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/snowflakes
          cp web/index.html web/style.css web/app.js web/worker.js _site/
          # The modules the browser loads into Pyodide, as listed in worker.js.
          cp snowflakes/__init__.py snowflakes/_snowflakes.py snowflakes/_numpy.py _site/snowflakes/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
